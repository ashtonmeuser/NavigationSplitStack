name: Test Xcode action

on:
  workflow_dispatch:
    inputs:
      device:
        description: Case-insensitive device name prefix, exact UDID/type identifier, or mac/macOS
        type: string
        required: true
        default: iPhone
      os:
        description: Optional OS prefix (blank selects newest compatible installed version; ignored for macOS)
        type: string
        required: false
        default: ''
      scheme:
        description: Shared Xcode scheme to test
        type: string
        required: true
        default: Minimal
      project:
        description: Optional .xcodeproj path relative to the repository root
        type: string
        required: false
        default: Examples/Examples.xcodeproj
      ad-hoc-signing:
        description: Use local ad-hoc signing instead of the project's signing settings
        type: boolean
        required: false
        default: true
      disableParallelization:
        description: Disable parallel testing instead of using the scheme setting
        type: boolean
        required: false
        default: false
      cache:
        description: Cache Swift package checkouts between successful runs
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  test-action:
    name: Test ${{ inputs.scheme }} on ${{ inputs.device }}
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Run local Xcode action
        id: xcode-test
        uses: ./.github/actions/xcode-test
        with:
          device: ${{ inputs.device }}
          os: ${{ inputs.os }}
          scheme: ${{ inputs.scheme }}
          project: ${{ inputs.project }}
          ad-hoc-signing: ${{ inputs.ad-hoc-signing }}
          disableParallelization: ${{ inputs.disableParallelization }}
          cache: ${{ inputs.cache }}
      - name: Upload failed test results
        if: ${{ failure() && steps.xcode-test.outputs.result-bundle-path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: xcode-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.xcode-test.outputs.result-bundle-path }}
          if-no-files-found: ignore
          include-hidden-files: true
