name: Xcode simulator tests
description: Find or provision a matching simulator, then run xcodebuild test.
inputs:
  device:
    description: Case-sensitive device name prefix, exact UDID, or exact deviceTypeIdentifier.
    required: true
  os:
    description: OS version prefix, such as '27' or '27.2'.
    required: true
  scheme:
    description: Shared Xcode scheme to test.
    required: true
  project:
    description: Optional .xcodeproj path, relative to the caller's working directory.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Select simulator and run tests
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TEST_DEVICE: ${{ inputs.device }}
        TEST_OS: ${{ inputs.os }}
        TEST_SCHEME: ${{ inputs.scheme }}
        TEST_PROJECT: ${{ inputs.project }}
      run: python3 "$ACTION_PATH/run.py"
