name: Xcode tests
description: Run xcodebuild test on macOS or a matching simulator, provisioning it if needed.
inputs:
  device:
    description: Case-insensitive simulator name prefix, exact UDID/type identifier, or mac/macos (case insensitive).
    required: true
  os:
    description: Optional OS version prefix. Selects the newest compatible installed version matching the prefix (any version if omitted), or downloads a match if needed. Ignored for mac/macOS.
    required: false
    default: ''
  scheme:
    description: Shared Xcode scheme to test.
    required: true
  project:
    description: Optional .xcodeproj path, relative to the caller's working directory.
    required: false
    default: ''
  ad-hoc-signing:
    description: Use local ad-hoc signing (true/false). Set false to preserve the project's signing settings.
    required: false
    default: 'true'
  disableParallelization:
    description: Disable parallel testing when true; otherwise use the scheme setting.
    required: false
    default: 'false'
  cache:
    description: Cache Swift package checkouts between successful runs (true/false).
    required: false
    default: 'true'
outputs:
  result-bundle-path:
    description: Absolute .xcresult path, published before testing. The bundle may not exist if Xcode fails before creating it.
    value: ${{ steps.test.outputs.result-bundle-path }}
runs:
  using: composite
  steps:
    - name: Compute Swift package cache key
      id: cache-key
      if: ${{ inputs.cache == 'true' }}
      shell: bash
      run: |
        xcode_version=$(xcodebuild -version | shasum -a 256 | cut -c 1-16)
        printf 'xcode=%s\n' "$xcode_version" >> "$GITHUB_OUTPUT"
    - name: Cache Swift packages
      if: ${{ inputs.cache == 'true' }}
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/xcode-test-source-packages
        key: xcode-test-spm-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-key.outputs.xcode }}-${{ hashFiles('**/Package.resolved', '**/Package.swift', '**/project.pbxproj') }}
    - name: Select destination and run tests
      id: test
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TEST_DEVICE: ${{ inputs.device }}
        TEST_OS: ${{ inputs.os }}
        TEST_SCHEME: ${{ inputs.scheme }}
        TEST_PROJECT: ${{ inputs.project }}
        TEST_AD_HOC_SIGNING: ${{ inputs.ad-hoc-signing }}
        TEST_DISABLE_PARALLELIZATION: ${{ inputs.disableParallelization }}
      run: python3 "$ACTION_PATH/run.py"
